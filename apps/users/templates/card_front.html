<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaidya Bandhu Card - Front</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background-color: #f3f8fa;
  }

  .card {
    width: 700px;
    height: 400px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    overflow: hidden;
    position: relative;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 20px 30px;
  }

  .header img {
    height: 50px;
    margin-right: 15px;
  }

  .header h2 {
    color: #007a8f;
    margin: 0;
    font-size: 26px;
    font-weight: 700;
  }

  .header p {
    color: #777;
    font-size: 14px;
    margin: 0;
  }

  .content {
    display: flex;
    justify-content: space-between;
    padding: 20px 30px;
  }

  .info {
    font-size: 15px;
    line-height: 1.8;
  }

  .info strong {
    color: #007a8f;
  }

  .photo {
    width: 150px;
    height: 150px;
    border-radius: 10px;
    overflow: hidden;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name {
    font-size: 18px;
    font-weight: 600;
    margin-top: 10px;
    text-align: center;
    color: #003f4c;
  }

  .footer {
    position: absolute;
    bottom: 0;
    width: 100%;
    background-color: #007a8f;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    font-size: 14px;
  }

  .footer a {
    color: white;
    text-decoration: none;
  }

</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">
    <div>
      <h2>VAIDYA BANDHU</h2>
      <p>HEALTHCARE MEMBERSHIP CARD</p>
    </div>
  </div>

  <div class="content">
    <div class="info">
      <p><strong>MEMBERSHIP ID :</strong> {{ membership_id }}</p>
      <p><strong>VALID TILL :</strong> {{ valid_till }}</p>
      <p><strong>CONTACT :</strong> {{ contact }}</p>
      <p><strong>BLOOD GROUP :</strong> {{ blood_group }}</p>
      <p><strong>ADDRESS :</strong> {{ address }}</p>
    </div>

    <div class="photo">
      <img src="{{ photo_url }}" alt="Member Photo">
      <div class="name">{{ name }}</div>
    </div>
  </div>

  <div class="footer">
    <div>📞 +91 8535853589</div>
    <div>✉️ support@vaidyabandhu.com</div>
  </div>
</div>
</body>
</html>
