<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vaidya Bandhu Membership Card (Front)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  padding: 0;
}
.card {
  position: relative;
  width: 100%;
  height: 600px;
  background-image: url("https://vaidya-bhandhu-prod.s3.ap-south-1.amazonaws.com/media/Frame%2059.png");
  background-size: cover;
  background-repeat: no-repeat;
  color: #003d4d;
}
.details {
  position: absolute;
  top: 150px;
  left: 80px;
  font-size: 16px;
  line-height: 1.8;
}
.details b {
  color: #003d4d;
}
.profile {
  position: absolute;
  top: 140px;
  right: 80px;
  width: 140px;
  height: 140px;
  border-radius: 10px;
  overflow: hidden;
}
.profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.name {
  position: absolute;
  bottom: 80px;
  right: 120px;
  font-size: 18px;
  font-weight: 600;
  color: #003d4d;
}
</style>
</head>
<body>
<div class="card">
  <div class="profile">
    <img src="{{ profile_image }}" alt="Profile">
  </div>
  <div class="details">
    <p><b>MEMBERSHIP ID:</b> {{ membership_id }}</p>
    <p><b>VALIDITY:</b> {{ start_date|date:"d/m/Y" }} - {{ end_date|date:"d/m/Y" }}</p>
    <p><b>CONTACT:</b> {{ mobile }}</p>
    <p><b>BLOOD GROUP:</b> {{ blood_group }}</p>
    <p><b>ADDRESS:</b> {{ address }}, {{ pin_code }}</p>
  </div>
  <div class="name">{{ full_name }}</div>
</div>
</body>
</html>
