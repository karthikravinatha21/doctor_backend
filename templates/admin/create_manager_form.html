{% extends "admin/change_form.html" %}
{% load static %}

{% block content %}
  <div id="content-main">
    <h1>Create Manager User</h1>

    <form method="post" novalidate class="admin-form">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="submit-row">
        <input type="submit" value="Save" class="default">
        <a href="{% url 'admin:user_details_user_changelist' %}" class="button cancel-link">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
